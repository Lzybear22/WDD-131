<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeBook | Simple recipes, beautifully organized</title>
  <meta name="description" content="RecipeBook is a collection of simple, delicious recipes for every occasion.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="RecipeBook">
  <meta property="og:description" content="Simple recipes, beautifully organized.">
  <meta property="og:url" content="https://lzybear22.github.io/recipes/">
  <meta property="og:image" content="images/social-preview-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RecipeBook">
  <meta name="twitter:description" content="Simple recipes, beautifully organized.">
  <meta name="twitter:image" content="images/social-preview-image.png">

  <link rel="icon" href="favicon.ico">

  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <img src="images/recipe-book.png" alt="" class="logo-icon">
      <h1 class="site-title">RecipeBook</h1>
    </div>

    <form class="search" role="search">
      <label for="search-input" class="visually-hidden">Find a recipe</label>
      <input type="search" id="search-input" name="search" placeholder="Find a recipe">
      <button type="submit" aria-label="Search">
        <img src="images/search.svg" alt="" class="icon-search">
      </button>
    </form>
  </header>

  <hr class="divider">

  <main>
    <article class="recipe-card">
      <img src="images/apple-crisp.jpg" alt="Apple crisp topped with a scoop of vanilla ice cream" class="recipe-image">

      <div class="recipe-info">
        <span class="tag">dessert</span>

        <h2 class="recipe-title">Apple Crisp</h2>

        <span
          class="rating"
          role="img"
          aria-label="Rating: 4 out of 5 stars"
        >
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>

        <p class="recipe-description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons" class="attribution">Recipe icons created by Freepik - Flaticon</a>

    <div class="social">
      <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
      <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
      <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
    </div>
  </footer>

</body>
</html>
